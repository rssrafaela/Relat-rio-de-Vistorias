<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6a138f" />

  <title>Vistoria Técnica TKE</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="brand-line"></div>

    <div class="header-inner">
      <img
        src="logo-tke.png"
        alt="TK Elevator"
        class="logo"
      />

      <div class="header-title">
        <h1>RELATÓRIO DE VISTORIA TÉCNICA</h1>
        <p>Ano Novo 2026/2027</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Identificação da vistoria</h2>

      <div class="grid">
        <div class="field">
          <label for="responsavel">Responsável</label>

          <input
            id="responsavel"
            type="text"
            placeholder="Digite o nome do técnico"
            autocomplete="name"
          />
        </div>

        <div class="field">
          <label for="data">Data</label>

          <input
            id="data"
            type="date"
          />
        </div>

        <div class="field full">
          <label for="equipamentoBusca">
            Equipamento
          </label>

          <input
            id="equipamentoBusca"
            type="text"
            list="listaEquipamentos"
            placeholder="Digite o número, por exemplo ER0001"
            autocomplete="off"
          />

          <datalist id="listaEquipamentos"></datalist>

          <small>
            Digite parte do código e selecione uma opção da lista.
          </small>
        </div>

        <div class="field">
          <label for="linha">Linha</label>

          <input
            id="linha"
            type="text"
            readonly
            class="readonly"
          />
        </div>

        <div class="field">
          <label for="estacao">Estação</label>

          <input
            id="estacao"
            type="text"
            readonly
            class="readonly"
          />
        </div>

        <div class="field">
          <label for="tipo">
            Tipo do equipamento
          </label>

          <input
            id="tipo"
            type="text"
            readonly
            class="readonly"
          />
        </div>

        <div class="field">
          <label for="fabricante">
            Fabricante / Modelo
          </label>

          <input
            id="fabricante"
            type="text"
            readonly
            class="readonly"
          />
        </div>
      </div>

      <div
        id="mensagemEquipamento"
        class="status hidden"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <section class="card">
      <div class="checklist-head">
        <div>
          <h2>Checklist de vistoria</h2>

          <p class="small">
            C = Conforme • NC = Não Conforme • NA = Não Aplicável
          </p>
        </div>

        <div
          class="progress-label"
          id="progresso"
        >
          0 / 43
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress">
          <span id="barra"></span>
        </div>
      </div>

      <div id="checklist"></div>
    </section>

    <section class="card no-print">
      <div class="actions">
        <button
          id="btnSalvar"
          class="secondary"
          type="button"
        >
          Salvar rascunho
        </button>

        <button
          id="btnExcel"
          class="secondary"
          type="button"
        >
          Exportar para Excel
        </button>

        <button
          id="btnImprimir"
          class="secondary"
          type="button"
        >
          Imprimir / PDF
        </button>

        <button
          id="btnEnviar"
          class="primary"
          type="button"
        >
          Finalizar vistoria
        </button>
      </div>

      <div
        id="statusFinal"
        class="status hidden"
        role="status"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <footer>
    TK Elevator • Sistema de Vistoria Técnica • 2026/2027
  </footer>

  <!-- Lista fixa dos itens da vistoria -->
  <script src="itens.js"></script>

  <!-- Base local de equipamentos -->
  <script src="equipamentos.js"></script>

  <!-- Código principal do aplicativo -->
  <script src="script.js"></script>
</body>
</html>
